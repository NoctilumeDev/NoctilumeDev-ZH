<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">NoctilumeDev project journey</title>
  <desc id="description">From five HTML experiments to DarkRoomLibrary, where Qixu and PlainJournal become separate business branches with distinct fact ownership, then through machine limits to four decoupled research lines for evidence, execution, authority, and proxy validity.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09101f"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
    <linearGradient id="veritrail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c45"/>
      <stop offset="1" stop-color="#102a3d"/>
    </linearGradient>
    <linearGradient id="feedback" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173150"/>
      <stop offset="1" stop-color="#1c2944"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72a9c5"/>
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d5a85b"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 34px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #7dd3c7; font: 700 15px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .card-title { fill: #f8fafc; font: 700 24px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .card-copy { fill: #cbd5e1; font: 400 17px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .small { fill: #94a3b8; font: 400 15px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .status { fill: #f8fafc; font: 700 14px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 0.5px; }
      .center { text-anchor: middle; }
      .line { fill: none; stroke: #72a9c5; stroke-width: 3; marker-end: url(#arrow); }
      .stop-line { fill: none; stroke: #d5a85b; stroke-width: 3; stroke-dasharray: 10 9; marker-end: url(#arrow-warm); }
      .return-line { fill: none; stroke: #e7bd73; stroke-width: 2; stroke-dasharray: 3 10; opacity: 0.86; marker-end: url(#arrow-warm); }
    </style>
  </defs>

  <rect width="1440" height="1080" rx="28" fill="url(#background)"/>

  <text x="72" y="64" class="eyebrow">PROJECT JOURNEY · 问题怎样一步步长出来</text>
  <text x="72" y="103" class="title">从业务分叉与单机边界，到四条权责分明的研究线</text>

  <path class="line" d="M 330 215 H 382"/>
  <path class="line" d="M 650 215 H 702"/>
  <path class="stop-line" d="M 970 215 H 1022"/>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="260" height="140" rx="18" fill="#152239" stroke="#35516e"/>
    <text x="200" y="180" class="eyebrow center">01 · 表达练习</text>
    <text x="200" y="216" class="card-title center">五个 HTML</text>
    <text x="200" y="246" class="card-copy center">叙事 · 排版 · 交互</text>
    <text x="200" y="270" class="small center">InkNarratives / 墨叙</text>

    <rect x="390" y="145" width="260" height="140" rx="18" fill="#152239" stroke="#35516e"/>
    <text x="520" y="180" class="eyebrow center">02 · 完整产品</text>
    <text x="520" y="216" class="card-title center">暗室藏书</text>
    <text x="520" y="246" class="card-copy center">业务闭环 · 角色边界</text>
    <text x="520" y="270" class="small center">增强型单体实战</text>

    <rect x="710" y="145" width="260" height="140" rx="18" fill="#152239" stroke="#4b6d88"/>
    <text x="840" y="180" class="eyebrow center">03 · 真实训练场</text>
    <text x="840" y="216" class="card-title center">素简记</text>
    <text x="840" y="246" class="card-copy center">分布式 · 可靠性 · 验收</text>
    <text x="840" y="270" class="small center">单机资源边界在这里暴露</text>

    <rect x="1030" y="145" width="340" height="140" rx="18" fill="#2b2530" stroke="#a77b45" stroke-dasharray="8 7"/>
    <text x="1200" y="180" class="eyebrow center" fill="#e7bd73">04 · 诚实停止</text>
    <text x="1200" y="216" class="card-title center">素简记 Pro</text>
    <text x="1200" y="246" class="card-copy center">多商户与跨机问题保留为计划</text>
    <text x="1200" y="270" class="small center">没有同强度证据，就不冒充实现</text>
  </g>

  <path class="line" d="M 520 285 V 327"/>
  <rect x="396" y="296" width="248" height="26" rx="13" fill="#163b4d" stroke="#4f93ad"/>
  <text x="520" y="314" class="status center">身份适配 · 不共享数据库</text>

  <g filter="url(#shadow)">
    <rect x="360" y="335" width="320" height="130" rx="20" fill="#152b42" stroke="#4f93ad"/>
    <text x="520" y="365" class="eyebrow center">独立业务支线</text>
    <text x="520" y="399" class="card-title center">Qixu / 期序</text>
    <text x="520" y="430" class="card-copy center">空间 · 资格 · 分配 · 使用权</text>
    <text x="520" y="453" class="small center">独立事实所有权 · 不继承上游角色</text>
  </g>

  <path class="line" d="M 840 285 V 486"/>
  <path class="stop-line" d="M 1200 285 V 486"/>
  <g filter="url(#shadow)">
    <rect x="170" y="495" width="1100" height="105" rx="22" fill="#20233a" stroke="#76648f"/>
    <text x="720" y="526" class="eyebrow center" fill="#c4a7e7">问题被抽象，而不是继续堆功能</text>
    <text x="720" y="558" class="card-title center">证据、执行、授权与代理有效性，需要由不同责任边界承接</text>
    <text x="720" y="584" class="card-copy center">四条研究线可以互相启发，但不会因此组成强制技术栈</text>
  </g>

  <text x="72" y="638" class="eyebrow">FOUR DECOUPLED RESEARCH LINES · 四条责任独立的研究线</text>
  <path class="line" d="M 720 600 V 660"/>
  <path class="line" d="M 720 660 H 195 V 680"/>
  <path class="line" d="M 720 660 H 540 V 680"/>
  <path class="line" d="M 720 660 H 885 V 680"/>
  <path class="line" d="M 720 660 H 1230 V 680"/>

  <g filter="url(#shadow)">
    <rect x="40" y="680" width="310" height="190" rx="22" fill="url(#veritrail)" stroke="#62c8bd" stroke-width="2"/>
    <text x="195" y="712" class="eyebrow center" style="font-size:13px">EVIDENCE &amp; VERDICT</text>
    <text x="195" y="744" class="card-title center">VeriTrail / 验迹</text>
    <text x="195" y="779" class="card-copy center" style="font-size:15px">这次运行究竟</text>
    <text x="195" y="802" class="card-copy center" style="font-size:15px">证明了什么？</text>
    <text x="195" y="825" class="small center" style="font-size:13px">Evidence · integrity · verdict</text>
    <rect x="91" y="837" width="208" height="24" rx="12" fill="#1e615f"/>
    <text x="195" y="854" class="status center">独立可用 · LOCAL-FIRST</text>

    <rect x="385" y="680" width="310" height="190" rx="22" fill="#172a42" stroke="#6699c2"/>
    <text x="540" y="712" class="eyebrow center" style="font-size:13px">COMPUTATION &amp; EXECUTION</text>
    <text x="540" y="744" class="card-title center">JPyxis</text>
    <text x="540" y="779" class="card-copy center" style="font-size:15px">谁定义计算，</text>
    <text x="540" y="802" class="card-copy center" style="font-size:15px">它又怎样执行？</text>
    <text x="540" y="825" class="small center" style="font-size:13px">Contract · identity · runtime · lifecycle</text>
    <rect x="426" y="837" width="228" height="24" rx="12" fill="#254d73"/>
    <text x="540" y="854" class="status center">单节点基线 · FROZEN</text>

    <rect x="730" y="680" width="310" height="190" rx="22" fill="#29293f" stroke="#8b82b6" stroke-dasharray="8 7"/>
    <text x="885" y="712" class="eyebrow center" style="font-size:13px">AUTHORITY &amp; RESOURCES</text>
    <text x="885" y="744" class="card-title center">FlowKernel / 流核</text>
    <text x="885" y="779" class="card-copy center" style="font-size:15px">行动者凭什么</text>
    <text x="885" y="802" class="card-copy center" style="font-size:15px">有权行动？</text>
    <text x="885" y="825" class="small center" style="font-size:13px">Capability · resources · revocation</text>
    <rect x="791" y="837" width="188" height="24" rx="12" fill="#4b466d"/>
    <text x="885" y="854" class="status center">研究计划 · PLANNED</text>

    <rect x="1075" y="680" width="310" height="190" rx="22" fill="#302b20" stroke="#d5a85b" stroke-dasharray="8 7"/>
    <text x="1230" y="712" class="eyebrow center" fill="#e7bd73" style="font-size:12px">OBJECTIVE &amp; PROXY VALIDITY</text>
    <text x="1230" y="744" class="card-title center" style="font-size:18px">漂移算法 / Drift Algorithm</text>
    <text x="1230" y="779" class="card-copy center" style="font-size:15px">代理是否仍支持</text>
    <text x="1230" y="802" class="card-copy center" style="font-size:15px">固定目标？</text>
    <text x="1230" y="825" class="small center" style="font-size:13px">有界观测 · 反馈</text>
    <rect x="1135" y="837" width="190" height="24" rx="12" fill="#5a4727"/>
    <text x="1230" y="854" class="status center" style="font-size:12px">RESEARCH_NOT_STARTED</text>
  </g>

  <path class="line" d="M 195 870 V 897"/>
  <path class="line" d="M 540 870 V 897"/>
  <path class="line" d="M 885 870 V 897"/>
  <path class="line" d="M 1230 870 V 897"/>
  <g filter="url(#shadow)">
    <rect x="130" y="905" width="1180" height="92" rx="24" fill="url(#feedback)" stroke="#567594"/>
    <text x="720" y="928" class="eyebrow center">可选组合 · 版本化制品 · 不共享权威</text>
    <text x="720" y="957" class="card-title center" style="font-size:20px">人拥有目标与授权；现实拥有真相</text>
    <text x="720" y="981" class="card-copy center" style="font-size:15px">研究线可以交换来源方拥有的制品，但不会因此组成强制流水线</text>
  </g>

  <path class="return-line" d="M 1308 952 C 1390 900 1410 230 1360 175 C 1280 92 1090 104 1000 205"/>
  <rect x="1010" y="615" width="360" height="34" rx="17" fill="#3d3328" stroke="#a77b45"/>
  <text x="1190" y="637" class="status center" fill="#e7bd73">回到素简记暴露的单机边界</text>

  <rect x="70" y="1018" width="620" height="44" rx="16" fill="#121d31" stroke="#30445f"/>
  <text x="380" y="1046" class="card-copy center">MiniSpringBoot · 框架机制拆解与真实全栈反证样本</text>
  <rect x="750" y="1018" width="620" height="44" rx="16" fill="#121d31" stroke="#30445f"/>
  <text x="1060" y="1046" class="card-copy center">MiniLinux · 操作系统机制学习与底层实验支线</text>
</svg>
